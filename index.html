<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Penlight</title>
  <style>
    /* 画面全体をペンライト化 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000; /* 初期値：黒 */
      transition: background-color 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 右上のホストログインボタン */
    #host-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* パスワード入力モーダル（画面中央） */
    #modal-overlay {
      display: none; /* 最初は隠す */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #222;
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 280px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .modal-box input {
      width: 80%;
      padding: 10px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }

    .modal-box button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #0088FF;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin: 0 5px;
    }

    .modal-box .cancel-btn {
      background: #555;
    }

    /* ホスト用操作パネル */
    #host-panel {
      display: none; /* 最初は隠す */
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 999;
      text-align: center;
      backdrop-filter: blur(5px);
      width: 85%;
      max-width: 320px;
    }

    /* カラー変更ボタン */
    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin: 4px;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 右上の鍵ボタン -->
  <button id="host-btn">🔑</button>

  <!-- パスワード入力用モーダル -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3 style="margin: 0 0 10px 0;">ホストログイン</h3>
      <input type="password" id="pass-input" placeholder="パスワードを入力">
      <div>
        <button id="pass-submit">送信</button>
        <button id="pass-cancel" class="cancel-btn">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- ホスト用カラー操作パネル -->
  <div id="host-panel">
    <p style="color: #fff; margin: 0 0 10px 0; font-size: 14px; font-weight: bold;">カラー制御（ホスト）</p>
    <button class="color-btn" style="background: #FF0000;" data-color="#FF0000"></button>
    <button class="color-btn" style="background: #00FF00;" data-color="#00FF00"></button>
    <button class="color-btn" style="background: #0088FF;" data-color="#0088FF"></button>
    <button class="color-btn" style="background: #FFFF00;" data-color="#FFFF00"></button>
    <button class="color-btn" style="background: #FF00FF;" data-color="#FF00FF"></button>
    <button class="color-btn" style="background: #FFFFFF;" data-color="#FFFFFF"></button>
    <button class="color-btn" style="background: #000000;" data-color="#000000"></button>
  </div>

  <!-- Firebase SDK (Compat版) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // 設定
    const HOST_PASSWORD = "Shoryu";
    let isHost = false;

    // 要素の取得
    const hostBtn = document.getElementById('host-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const passInput = document.getElementById('pass-input');
    const passSubmit = document.getElementById('pass-submit');
    const passCancel = document.getElementById('pass-cancel');
    const hostPanel = document.getElementById('host-panel');

    // Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyAD5kCPaU8TIoYwOxiIhpMX4GfWUmUThzs",
      authDomain: "iikannji-project.firebaseapp.com",
      databaseURL: "https://iikannji-project-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "iikannji-project",
      storageBucket: "iikannji-project.firebasestorage.app",
      messagingSenderId: "839157940335",
      appId: "1:839157940335:web:186628644376b8c981cd9a",
      measurementId: "G-Y4Y5GTQT1W"
    };

    // 🔑 ボタンを押したとき
    hostBtn.addEventListener('click', () => {
      if (isHost) {
        alert("すでにホストモードです。");
        return;
      }
      modalOverlay.style.display = 'flex'; // モーダルを表示
      passInput.value = '';
      passInput.focus();
    });

    // キャンセルボタン
    passCancel.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    // パスワード送信処理
    function checkPassword() {
      if (passInput.value === HOST_PASSWORD) {
        isHost = true;
        modalOverlay.style.display = 'none';
        hostPanel.style.display = 'block';
      } else {
        alert("パスワードが違います。");
      }
    }

    passSubmit.addEventListener('click', checkPassword);

    // エンターキーでもパスワード送信できるように追加
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    let db, colorRef;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      colorRef = db.ref('lightColor');

      // 【ゲスト側】リアルタイム受信（他の人の画面の色が変わる）
      colorRef.on('value', (snapshot) => {
        const newColor = snapshot.val();
        if (newColor) {
          document.body.style.backgroundColor = newColor;
        }
      });
    } catch (e) {
      console.error("Firebase初期化エラー:", e);
    }

    // 色ボタンを押したときの処理
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const hexColor = e.target.getAttribute('data-color');
        
        // 自分の画面の色を変える
        document.body.style.backgroundColor = hexColor;

        // ホストならFirebaseに書き込み（全員の画面が変わる）
        if (isHost && colorRef) {
          colorRef.set(hexColor).catch(err => {
            console.error("書き込みエラー:", err);
            alert("色の変更に失敗しました。Realtime Databaseが作成されているか確認してください。");
          });
        }
      });
    });

    // 画面スリープ防止
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(err => {});
    }
  </script>
</body>
</html>
